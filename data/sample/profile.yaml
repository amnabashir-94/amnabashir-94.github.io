projects:
  - id: courtyard-library
    title: Courtyard Library, Walled City
    context: academic
    organisation: Example School of Architecture
    role:
      state: verified
      value: Sole author — thesis project
    period:
      state: verified
      value: '2021–2022'
    status:
      state: verified
      value: academic
    location:
      state: verified
      value: Lahore, Pakistan
    typology: [Institutional, Adaptive reuse]
    area:
      state: verified
      value: '1,850 m²'
    summary: >-
      A neighbourhood library threaded through three restored courtyard houses, using the
      courtyards as reading rooms open to the sky.
    brief: >-
      Insert a public library into a dense block of the Walled City without demolishing the
      fabric that makes it worth visiting: three derelict courtyard houses, a narrow lane
      frontage, and no room for a new building of any size.
    approach:
      - >-
        Rather than build, the scheme connects. The three courtyards become the reading rooms,
        the rooms around them become stacks, and a single new stair ties the levels together
        where a collapsed house had already left a gap.
      - >-
        Shade, cross-ventilation and thermal mass are borrowed from the houses themselves.
        New interventions are in steel and lime plaster, legible as new, and removable.
    outcome: >-
      Awarded a distinction and exhibited at the end-of-year show. The approach informed the
      later market pavilion competition entry.
    software: [Revit, Rhino, Enscape, Photoshop]
    research:
      degree: B.Arch thesis
      supervisor: A fictional supervisor
      questions:
        - How can a public library be inserted into dense historic fabric without demolition?
        - Which courtyard-house qualities make a comfortable reading room without air conditioning?
      methods:
        - label: Measured survey
          text: >-
            Fictional method: the three houses were measured and drawn at 1:50 to record what
            survived and what could be reused.
        - label: Climate observation
          text: >-
            Fictional method: temperatures were logged in each courtyard across a summer week to
            compare shaded and unshaded rooms.
      sample:
        survey:
          state: missing
          basis: Shows a strict sample size held back until confirmed.
        interviews:
          state: verified
          value: around 12
      sites: [Three courtyard houses, Walled City, Lahore]
      findings:
        - label: Shade beats glass
          text: >-
            Fictional finding: the deepest courtyard stayed coolest through the afternoon, so it
            became the main reading room.
      recommendations:
        - label: Connect, do not build
          text: >-
            Fictional recommendation: reuse the existing rooms and add only a stair, so the
            intervention can be removed without loss.
    cover: courtyard-render.jpg
    images:
      - file: courtyard-render.jpg
        kind: render
        alt: Render of a shaded courtyard lined with bookshelves under carved timber balconies.
        caption: Central courtyard as reading room
      - file: ground-floor-plan.png
        kind: drawing
        alt: Ground floor plan showing three courtyards linked by a new stair.
        caption: Ground floor plan
      - file: long-section.png
        kind: drawing
        alt: Long section through the three courtyards and the new stair.
        caption: Long section A–A
      - file: massing-model.jpg
        kind: model
        alt: White card massing model of the block, with the three courtyards cut out.
        caption: Massing model, 1:200
      - file: zoning-diagram.png
        kind: diagram
        alt: Diagram zoning the block into public, service, garden and private areas.
        caption: Zoning diagram

