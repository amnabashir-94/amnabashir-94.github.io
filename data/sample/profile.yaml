about:
  - >-
    A fictional architect used to preview this site's layout. Five years across residential
    practice, interior fit-outs and competition work, with a thesis on courtyard libraries in
    the Walled City.
  - >-
    The paragraphs here exist to show measure and rhythm: how a lede sits above a body
    paragraph, and how the About page reads with three paragraphs of real length rather than
    a single line of placeholder text.
  - >-
    The fastest way to reach a real architect on a real version of this site is the email
    address in the footer. This one is example.com, which goes nowhere by design.

