# ─────────────────────────────────────────────────────────────────────────────────────
#  LAYOUT FIXTURE — fictional. Not Amna, not her work, not anyone's.
#
#  Two jobs: preview the layout before real content exists (`npm run dev:sample`), and show
#  what a complete profile looks like — every field, every claim state, every image kind. The
#  real profile is data/profile.yaml; nothing reads this file unless PROFILE_FILE points at it.
#
#  `sample: true` puts a banner on every page and makes check-dist refuse the build unless
#  sample mode was asked for, so this can never be deployed as her site.
#
#  Images are generated by scripts/make-sample-images.ts into src/assets/sample/ (git-ignored).
# ─────────────────────────────────────────────────────────────────────────────────────

