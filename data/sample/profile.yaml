    summary: >-
      A one-kanal family house organised around a deep veranda and a stepped garden court.
    brief: >-
      A family of five wanted a house that stays cool without running air conditioning all
      summer, on a west-facing plot with neighbours close on two sides.
    approach:
      - >-
        The house turns its back to the west with a solid brick wall and opens east onto a
        garden court, sheltered by a veranda deep enough to use through the afternoon.
      - >-
