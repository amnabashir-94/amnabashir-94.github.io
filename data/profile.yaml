about:
  - >-
    I am an architect in Lahore. Since 2022 I have worked as Assistant Director Architecture in
    the Punjab Architecture Department of the Communication & Works Department, designing and
    managing public building projects for the Government of Punjab. I graduated from Lahore
    College for Women University as the gold medallist of the Bachelor of Architecture.
  - >-
    Before government service I spent three years as an architect at Kazmain Design & Interior
    Contractors, leading design projects for private clients and seeing them through
    construction, while teaching architectural design as a visiting lecturer in the department
    where I had studied.
  - >-
    My master's research at the University of Engineering and Technology, Lahore, asks what the
    COVID-19 pandemic changed about how people use the city's parks, markets and mosques — and
    found that in the neighbourhoods I studied, those spaces were never equally open to women.
    Designing and planning public space that works for everyone who depends on it is the work I
    want to do next.

featured:
