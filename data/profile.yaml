projects:
  - id: covid-public-spaces-lahore
    title: Implications of COVID-19 Pandemic on Behavioural Patterns of Users of Public Spaces in Lahore
    context: academic
    organisation: Department of Architecture, University of Engineering and Technology, Lahore
    role:
      state: verified
      value: Sole researcher and author
      basis: Statement of originality in the thesis.
    credits: Supervised by Dr. Maryam Siddiq, Department of Architecture, UET Lahore.
    period:
      state: verified
      value: '2025'
      basis: Year on the thesis cover.
    status:
      state: verified
      value: academic
    location:
      state: verified
      value: Lahore, Pakistan
    typology: [Urban research, Public space]
    summary: >-
      How the COVID-19 pandemic changed the way people in four Lahore neighbourhoods use their
      parks, markets and mosques — and what it revealed about who those spaces were built for.
    brief: >-
      When the pandemic closed Lahore's public spaces, it showed how much daily life depends on
      them, and how little was known about how residents actually use them. This thesis set out
      to record what changed in the parks, markets and mosques of four Lahore Development
      Authority housing schemes, before and during COVID-19: how often people came, what they
      did there, how safe they felt, and whether the spaces served women and men equally.
    approach:
      - >-
        A mixed-methods study. Activities in each space were classified, after Jan Gehl, as
        necessary, optional or social, and the physical and social dimensions of parks,
        markets and mosques were broken down into measurable indicators — lighting,
        surveillance, entrances, seating, group sizes, frequency of visits — so that change
        could be compared like with like, before the pandemic and during it.
      - >-
        Fieldwork in Mustafa Town, Shadbagh, Gulshan-e-Ravi and Tajpura combined a
        questionnaire in English and Urdu, in-depth interviews, observation at different times
        of day, a photographic survey and land-use mapping, set against Google's Community
        Mobility Reports for Lahore as a city-wide baseline.
    outcome: >-
      The thesis closes with site-specific recommendations for the Lahore Development Authority
      — from women-led safety audits and better-lit, more open park layouts to prayer areas and
      separate entrances for women in neighbourhood mosques — and a set of design principles for
      public space after the pandemic.
    cover: four-lda-schemes-site-map.jpg
    images:
      - file: four-lda-schemes-site-map.jpg
        kind: diagram
        alt: >-
          Satellite map of Lahore with the four surveyed housing schemes — Shadbagh, Tajpura,
          Gulshan-e-Ravi and Mustafa Town — outlined in red and marked with pins.
        caption: The four LDA housing schemes studied
        credit: Base imagery Google Earth; annotation by Amna Bashir
    research:
      degree: M.Arch thesis
      supervisor: Dr. Maryam Siddiq
      questions:
        - >-
          How did the use of Lahore's public spaces change before and during the COVID-19
          pandemic, and what drove those changes?
        - How did the pandemic change the way people behave in public space?
        - >-
          How did users perceive the safety, attractiveness and usability of public spaces
          before and during the pandemic?
        - >-
          To what extent are Lahore's public spaces androcentric — designed around men — and
          did the pandemic deepen that bias?
        - >-
          What changes to policy and management would make public spaces more resilient to
          future health crises?
      methods:
        - label: Survey
          text: >-
            A structured questionnaire in English and Urdu, with closed and Likert-scale
            questions on how often and why residents used parks, markets and mosques and how
            safe they felt, asked for the period before the pandemic and during it. Collected in
            person, with COVID-19 precautions, from 24 June to 6 July 2022.
        - label: Interviews
          text: >-
            Semi-structured interviews with women, men and young people aged 15 to 55, held in
            Urdu between 6 and 21 July 2022, transcribed into English and analysed thematically.
        - label: Observation
          text: >-
            Non-participant observation at a park, a market and a mosque in each scheme over
            several weeks, at different times of day and week — recording group sizes,
            distancing, mask use and the activities taking place.
        - label: Spatial analysis
          text: >-
            Land-use maps, satellite base maps, a visual audit and a photographic survey of each
            site, read against Google Community Mobility Reports for Lahore from March, May and
            July 2020.
      sample:
        survey:
          state: missing
          basis: Respondent count to confirm against the final thesis.
        interviews:
          state: verified
          value: around 60
          basis: Thesis §3.3.6.
      sites: [Mustafa Town, Shadbagh, Gulshan-e-Ravi, Tajpura]
      findings:
        - label: Parks mattered more
          text: >-
            Walking and exercise rose in all four parks during the pandemic while lingering and
            gathering fell: parks became places for physical and mental health rather than for
            socialising, and residents with little private outdoor space relied on them most.
        - label: Markets shrank to transactions
          text: >-
            Every kind of market activity fell. Shopping became planned, quick and increasingly
            contactless, women withdrew from markets without visible safety measures, and
            informal vendors bore the economic loss.
        - label: A gendered wall around the mosque
          text: >-
            Men's attendance fell and worship adapted — ablution at home, distanced rows, verbal
            greetings in place of handshakes. Women were already excluded: none of the surveyed
            mosques had a prayer area for women, so the pandemic revealed that exclusion rather
            than causing it.
        - label: Safety felt unequally
          text: >-
            Men largely felt safe in the parks; women avoided poorly lit parks in the evening. The
            pandemic acted as both a mirror and a magnifier of the gender inequities already
            built into these spaces.
        - label: What makes a space feel safe changed
          text: >-
            Before the pandemic users judged public space by lighting, surveillance and
            amenities; during it, by openness, distance from others and the risk of exposure.
      recommendations:
        - label: Women-led safety audits
          text: >-
            Audit neighbourhood parks and markets with women, to find the dark corners, single
            gates and missing facilities that keep them away.
        - label: Light, sightlines and exits
          text: >-
            Reliable solar LED lighting, trimmed planting, transparent boundaries and more than
            one entrance, so that no one feels trapped.
        - label: Activity zoning
          text: >-
            Family zones near entrances, walking tracks along open edges and quiet green corners,
            so women can choose where they feel comfortable.
        - label: Women in mosques
          text: >-
            Prayer areas, separate well-lit entrances and ablution spaces for women in new and
            existing mosques, and women on mosque committees.
        - label: Measure who comes
          text: >-
            Track women's use of each space for six to twelve months after every intervention,
            so design decisions are judged by who actually uses the result.

