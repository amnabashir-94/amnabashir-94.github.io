research:
  summary:
    - >-
      My research asks what Lahore's public spaces are for, and for whom. My M.Arch thesis at the
      University of Engineering and Technology, Lahore, traced how the COVID-19 pandemic changed
      the use of parks, markets and mosques in four Lahore Development Authority housing schemes,
      combining a bilingual survey, in-depth interviews, observation and mapping.
    - >-
      Its sharpest finding is that the pandemic did not so much create inequality in public space
      as expose it: in the neighbourhoods studied, women were already absent from mosques and wary
      of poorly lit parks and crowded markets, and the crisis made that visible. The thesis ends in
      concrete recommendations for the city's development authority — and in the question I want
      to pursue next: how to design public space that is safe, healthy and open to everyone.
  interests:
    state: assumed
    value:
      - Gender-inclusive public space
      - Health-resilient cities after the pandemic
      - Behaviour in public space
      - Public space policy and management
      - Climate change and sustainable cities
    basis: >-
      Read from the themes of her M.Arch thesis and the courses on her CV; to confirm as the
      directions she wants to pursue.
  motivation: >-
    It began at my window. Stranded at home in the first months of the pandemic, I watched the
    service road outside — normally a through-route from a busy commercial area — empty of cars,
    of people, of noise. Then, slowly, it filled again: people jogging, then cycling, children
    playing, neighbours celebrating birthdays on the pavement. That space became my own escape
    from the house, and I began to realise what a privilege it was to have open space nearby
    where I felt safe. My thesis asks what public space meant for everyone else in the city.

